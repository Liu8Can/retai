name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2
        with:
          nuget-version: '6.x'

      - name: NuGet Restore
        run: nuget restore Tai.sln

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Solution
        run: msbuild Tai.sln /p:Configuration=${{ matrix.configuration }} /p:Platform="Any CPU" /m /v:minimal

      - name: Upload Build Artifacts
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: retai-release-bin
          path: |
            UI/bin/Release/
            Core/bin/Release/
            TaiBug/bin/Release/
            Updater/bin/Release/
          retention-days: 7

  test:
    runs-on: windows-2022
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2
        with:
          nuget-version: '6.x'

      - name: Restore Solution
        run: |
          nuget restore Tai.sln
          dotnet restore Tests/Tai.Tests/Tai.Tests.csproj

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Solution (Debug)
        run: msbuild Tai.sln /p:Configuration=Debug /p:Platform="AnyCPU" /m /v:minimal

      - name: Build and Run Tests
        run: dotnet test Tests/Tai.Tests/Tai.Tests.csproj --configuration Debug --no-build --logger "console;verbosity=detailed"
